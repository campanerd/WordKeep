info:
  name: Primeiro Teste Retorno da API
  type: http
  seq: 10

http:
  method: GET
  url: http://localhost:8080/words/translate?word=car&sourceLanguage=en&targetLanguage=pt
  params:
    - name: word
      value: car
      type: query
    - name: sourceLanguage
      value: en
      type: query
    - name: targetLanguage
      value: pt
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
