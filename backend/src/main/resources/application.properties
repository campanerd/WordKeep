spring.application.name=wordkeep

# Conexão com SQLite
spring.datasource.url=jdbc:sqlite:wordkeep.db?foreign_keys=on
spring.datasource.driver-class-name=org.sqlite.JDBC

# Dialeto do Hibernate para SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Cria/atualiza as tabelas
spring.jpa.hibernate.ddl-auto=none

# Mostra o SQL gerado no console (útil durante desenvolvimento)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Serializa datas como texto ISO (ex: 2026-05-11T14:30:00) em vez de número
spring.jackson.serialization.write-dates-as-timestamps=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
